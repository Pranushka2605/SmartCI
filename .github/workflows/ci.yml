
name: SmartCI - Dynamic Test Subset Routing

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Detect changed files
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            git diff --name-only \
              "${{ github.event.pull_request.base.sha }}" \
              "${{ github.event.pull_request.head.sha }}" \
              > changed_files.txt
          elif [ "${{ github.event.before }}" = "0000000000000000000000000000000000000000" ]; then
            git ls-files > changed_files.txt
          else
            git diff --name-only \
              "${{ github.event.before }}" \
              "${{ github.sha }}" \
              > changed_files.txt
          fi

          echo "Changed files:"
          cat changed_files.txt

      - name: Select relevant tests
        run: |
          python scripts/select_tests.py --input changed_files.txt

      - name: Run selected tests
        run: |
          if [ -s selected_tests.txt ]; then
            echo "Running selected tests:"
            cat selected_tests.txt
            python -m pytest -v $(cat selected_tests.txt) 2>&1 | tee build.log
          else
            echo "No mapped source changes. Running full test suite."
            python -m pytest -v 2>&1 | tee build.log
          fi
      - name: Generate LLM prompt
        if: always()
        run: |
          if [ -f build.log ]; then
            python scripts/summarize_logs.py --input build.log
          fi
      - name: Generate failure summary
        if: failure()
        run: |
          echo "## CI Test Failure Summary" >> $GITHUB_STEP_SUMMARY
          echo "Check the build.log artifact for the test output." >> $GITHUB_STEP_SUMMARY
          if [ -f build.log ]; then
            echo '```text' >> $GITHUB_STEP_SUMMARY
            tail -n 30 build.log >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
          fi

      - name: Upload log analysis
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ci-error-analysis
          path: |
            build.log
            llm_prompt.txt
          if-no-files-found: warn
          