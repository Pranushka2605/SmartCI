- name: Prepare LLM log summary
        if: always()
        run: python scripts/summarize_logs.py --input build.log

      - name: Upload log analysis
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ci-error-analysis
          path: |
            build.log
            llm_prompt.txt
            - name: Run tests
        run: |
          set -o pipefail
          pytest -v 2>&1 | tee build.log
          