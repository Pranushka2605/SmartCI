
name: Dynamic Test Subset Routing

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  dynamic-testing:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Detect changed files
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            git diff --name-only \
              "${{ github.event.pull_request.base.sha }}" \
              "${{ github.event.pull_request.head.sha }}" \
              > changed_files.txt
          elif [ "${{ github.event.before }}" = "0000000000000000000000000000000000000000" ]; then
            git ls-files > changed_files.txt
          else
            git diff --name-only \
              "${{ github.event.before }}" \
              "${{ github.sha }}" \
              > changed_files.txt
          fi

      - name: Select relevant tests
        run: |
          python scripts/select_tests.py --input changed_files.txt

      - name: Run selected tests
        run: |
          if [ -s selected_tests.txt ]; then
            pytest -v $(cat selected_tests.txt)
          else
            echo "No mapped source changes. Running full test suite."
            pytest -v
          fi
